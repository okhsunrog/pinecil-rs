name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, tests and ELF audits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install the pinned Rust toolchain and components
        run: rustup show active-toolchain

      - name: Check dependency sources, formatting, tests and firmware
        run: bash tools/check.sh

      - name: Prepare the bootable flash ELF
        run: uv run --no-project tools/flash_image.py target/riscv32imfc-unknown-none-elf/release/pinecil-rs

      - name: Prepare the experimental BLE image
        run: uv run --no-project tools/flash_image.py target/riscv32imfc-unknown-none-elf/release/examples/ble

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pinecil-rs-firmware
          path: |
            target/riscv32imfc-unknown-none-elf/release/pinecil-rs
            target/riscv32imfc-unknown-none-elf/release/pinecil-rs.flash.elf
            target/riscv32imfc-unknown-none-elf/release/examples/ble
            target/riscv32imfc-unknown-none-elf/release/examples/ble.flash.elf
          if-no-files-found: error
