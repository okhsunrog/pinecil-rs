# Pico: GP14=TMS, GP19=TCK, GP18=TDI, GP21=TDO, GP15=nTRST.
# Validated with Grapple Probe Pico; compatible wiring with JTAGprobe v4.1.
# No flash bank or reset sequence: this configuration is for RAM bring-up.
source [find interface/cmsis-dap.cfg]
transport select jtag
adapter speed 1000
reset_config none
jtag newtap bl706 cpu -irlen 5 -expected-id 0x20000e05
target create bl706.cpu riscv -chain-position bl706.cpu

# ELF segments are loaded using ordinary RAM writes, never flash commands.
gdb_flash_program disable
